    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#gf-bevel)" stroke-width="2" opacity="0.6"/>

    <path d="M -100,-146 A 150,150 0 0 1 100,-146" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" fill="none"/>
